name: Build & Test
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential cmake ninja-build \
          libasound2-dev libjack-jackd2-dev libfreetype6-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libxext-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev
    - name: Build Release
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: SilentRiot-Linux-VST3
        path: "build/TinyTerror_artefacts/Release/VST3/"
        if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release
    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: SilentRiot-Windows-VST3
        path: "build/TinyTerror_artefacts/Release/VST3/"
        if-no-files-found: warn
    - name: Upload Standalone
      uses: actions/upload-artifact@v4
      with:
        name: SilentRiot-Windows-Standalone
        path: "build/TinyTerror_artefacts/Release/Standalone/"
        if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential cmake ninja-build \
          libasound2-dev libjack-jackd2-dev libfreetype6-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libxext-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev
    - name: Build + Test
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTT_BUILD_TESTS=ON
        cmake --build build
        cd build && ctest --output-on-failure
