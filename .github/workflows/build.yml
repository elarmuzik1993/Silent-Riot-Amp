name: Build & Test
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential cmake ninja-build \
          libasound2-dev libjack-jackd2-dev libfreetype6-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libxext-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev
    - name: Build Release
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: SilentRiot-Linux-VST3
        path: "build/SilentRiot_artefacts/Release/VST3/"
        if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        cmake --build build --config Release
    - name: Verify VST3 DLL dependencies
      run: |
        $vst3 = "build\SilentRiot_artefacts\Release\VST3\Silent Riot.vst3\Contents\x86_64-win\Silent Riot.vst3"
        Write-Host "=== File info ==="
        Get-Item $vst3 | Select-Object Name, Length, LastWriteTime
        Write-Host "=== DLL dependencies ==="
        dumpbin /DEPENDENTS $vst3
        Write-Host "=== Exports ==="
        dumpbin /EXPORTS $vst3 | Select-String "GetPluginFactory|InitDll|ExitDll|bundleEntry|bundleExit"
      shell: pwsh
    - name: Smoke-test Standalone
      run: |
        $exe = "build\SilentRiot_artefacts\Release\Standalone\Silent Riot.exe"
        Write-Host "=== Standalone dependencies ==="
        dumpbin /DEPENDENTS $exe
    - name: Upload VST3
      uses: actions/upload-artifact@v4
      with:
        name: SilentRiot-Windows-VST3
        path: "build/SilentRiot_artefacts/Release/VST3/"
        if-no-files-found: warn
    - name: Upload Standalone
      uses: actions/upload-artifact@v4
      with:
        name: SilentRiot-Windows-Standalone
        path: "build/SilentRiot_artefacts/Release/Standalone/"
        if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential cmake ninja-build \
          libasound2-dev libjack-jackd2-dev libfreetype6-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libxext-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev
    - name: Build + Test
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSR_BUILD_TESTS=ON
        cmake --build build
        cd build && ctest --output-on-failure
