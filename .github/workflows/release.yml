name: Release

# Git-tag-driven release automation (roadmap P3). Pushing a tag like `v0.3.4`
# builds the Release binaries on Linux + Windows, packages them into versioned
# archives, and publishes a GitHub Release with the artifacts attached.
#
# Code signing is intentionally NOT wired here yet — Windows Authenticode and
# macOS notarization require certificates/secrets the maintainer must provide.
# See the "sign" placeholder steps below for where they slot in.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version label for a manual packaging dry-run"
        required: false
        default: "dev"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
  # Days to keep the packages uploaded below. They share the account's artifact
  # storage quota with build.yml, and a full quota fails "Upload package", so
  # publish never runs. publish attaches them to the GitHub Release (kept
  # permanently) minutes later; the window is for inspecting dry-run packages.
  # Once they expire, retrying a failed publish needs "Re-run all jobs" (which
  # rebuilds them), not "Re-run failed jobs".
  ARTIFACT_RETENTION_DAYS: 6

jobs:
  package-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux-deps
      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build Release
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          STAGE="SilentRiot-${VER}-Linux"
          mkdir -p "$STAGE"
          cp -r "build/SilentRiot_artefacts/Release/VST3/." "$STAGE/"
          cp -r "build/SilentRiot_artefacts/Release/Standalone/." "$STAGE/"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          # The fonts are embedded in the binary; OFL 1.1 needs their licences to travel with it.
          cp CREDITS.md resources/fonts/OFL-*.txt "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
      # - name: Sign (placeholder — requires GPG secret) ...
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SilentRiot-Linux-package
          path: |
            SilentRiot-*-Linux.tar.gz
            SilentRiot-*-Linux.tar.gz.sha256
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build Release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release
      # - name: Sign (placeholder — requires Authenticode cert secret) ...
      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $stage = "SilentRiot-$ver-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "build\SilentRiot_artefacts\Release\VST3\*" $stage
          Copy-Item -Recurse "build\SilentRiot_artefacts\Release\Standalone\*" $stage
          Copy-Item README.md, LICENSE $stage -ErrorAction SilentlyContinue
          # The fonts are embedded in the binary; OFL 1.1 needs their licences to travel with it.
          Copy-Item CREDITS.md, resources\fonts\OFL-*.txt $stage -ErrorAction Stop
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -Force
          (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash | Out-File "$stage.zip.sha256"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SilentRiot-Windows-package
          path: |
            SilentRiot-*-Windows.zip
            SilentRiot-*-Windows.zip.sha256
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  publish:
    # Only publish a GitHub Release for real tag pushes, not manual dry-runs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux, package-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        # The body is this version's "## [x.y.z]" section, else "## [Unreleased]"
        # (a tag pushed before the section was renamed); GitHub's generated
        # notes are appended after it. Neither → an empty body, so the release
        # gets the generated notes alone (the previous behaviour).
        run: |
          VER="${GITHUB_REF_NAME#v}"
          section() {
            awk -v h="$1" '
              /^## \[/ { if (found) exit; if (index($0, "## [" h "]") == 1) { found = 1; next } }
              found
            ' CHANGELOG.md
          }
          section "$VER" > release-notes.md || true
          [ -s release-notes.md ] || section Unreleased > release-notes.md || true
          echo "release notes: $(wc -l < release-notes.md) lines for $VER"
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/SilentRiot-*-Linux.tar.gz
            dist/SilentRiot-*-Linux.tar.gz.sha256
            dist/SilentRiot-*-Windows.zip
            dist/SilentRiot-*-Windows.zip.sha256
